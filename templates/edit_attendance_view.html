
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Chamada - {{ encontro.tema }}</title>
    <link rel="stylesheet" href="{{url_for('static', filename='css/stylehomepage.css')}}">
    <link rel="stylesheet" href="{{url_for('static', filename='css/styleedit_attendance_view.css')}}">
    <link rel="shortcut icon" href="{{url_for('static', filename='images/faviconcrisma.ico')}}" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="header-left">
            <img src="{{url_for('static', filename='images/logocrismamaior.png')}}" alt="Logo da crisma" class="logo">
            <h1 class="title-center" onclick="window.location.href='/homepage'">Chamada da Crisma</h1>
        </div>
        <form action="{{url_for('logout_user')}}" method="post">
            <button class="button-logout">Sair</button>
        </form>
    </header>

    <div class="container-principal">
        <h1>Editando Chamada</h1>
        <div class="info-chamada">
            <p><strong>Tema:</strong> {{ encontro.tema }}</p>
            <p><strong>Data:</strong> {{ encontro.meeting_date }}</p>
            <p><strong>Turma:</strong> {{ turma.turma_name }}</p>
        </div>

        <form action="{{ url_for('save_attendance_edit') }}" method="post">
            <input type="hidden" name="meeting_id" value="{{ encontro.id }}">
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Crismando</th>
                            <th>Presença</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for item in lista_presenca %}
                        <tr>
                            <td>{{ item.name }}</td>
                            <td>
                                <select name="status_{{ item.id }}">
                                    <option value="" {% if item.status is none %}selected{% endif %} disabled>-</option>
                                    <option value="0" {% if item.status == 0 %}selected{% endif %}>P</option>
                                    <option value="1" {% if item.status == 1 %}selected{% endif %}>F</option>
                                    <option value="2" {% if item.status == 2 %}selected{% endif %}>FJ</option>
                                </select>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
            <div class="actions">
                <button type="submit" class="btn-confirm">Salvar Alterações</button>
                <a href="{{ url_for('edit_attendance') }}" class="btn-cancel">Voltar</a>
            </div>
        </form>
    </div>
</body>
</html>
