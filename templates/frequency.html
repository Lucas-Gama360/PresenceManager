<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurações</title>
    <link
      rel="stylesheet"
      href="{{url_for('static', filename='css/stylehomepage.css')}}"
    />
    <link
      rel="stylesheet"
      href="{{url_for('static', filename='css/stylefrequency.css')}}"
    />
    <link
      rel="shortcut icon"
      href="{{url_for('static', filename='images/faviconcrisma.ico')}}"
      type="image/x-icon"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
</head>
<body>
    <header>
      <div class="header-left">
        <img
          src="{{url_for('static', filename='images/logocrismamaior.png')}}"
          alt="Logo da crisma"
          class="logo"
        />
        <h1 class="title-center" onclick="window.location.href='/homepage'" >Chamada da Crisma</h1>
      </div>
      <form action="{{url_for('logout_user')}}" method="post">
        <button class="button-logout">Sair</button>
      </form>
    </header>
    <div class="container-principal">
     <h1>Relatório de Frequência</h1>
        <p>Alunos em <strong>vermelho</strong> possuem menos de 60% de presença nos últimos 5 encontros.</p>

        <table>
            <thead>
                <tr>
                    <th>Nome do Crismando</th>
                    <th>Frequência (%)</th>
                </tr>
            </thead>
            <tbody>
                <!-- O 'for' percorre a lista 'report' que o Python enviou -->
                {% for aluno in report %}
                <tr>
                    <!-- Se o percentual for menor que 70, aplica a cor vermelha -->
                    <td class="{{ 'baixa-frequencia' if aluno.percentual < 60 else '' }}">
                        {{ aluno.nome }}
                    </td>
                    <td class="{{ 'baixa-frequencia' if aluno.percentual < 60 else '' }}">
                        {{ aluno.percentual }}%
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
